<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="settings-page">
      <section class="settings-card" aria-labelledby="settings-title">
        <div class="header">
          <p class="eyebrow">Profile</p>
          <h1 id="settings-title">Account Settings</h1>
        </div>

        <form id="settings-form" novalidate>
          <div class="field-group">
            <label for="name">Full name</label>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Enter your full name"
              aria-describedby="name-error"
            />
            <small id="name-error" class="error-message" aria-live="polite"></small>
          </div>

          <div class="field-group">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              aria-describedby="email-error"
            />
            <small id="email-error" class="error-message" aria-live="polite"></small>
          </div>

          <div class="actions">
            <button type="submit" class="submit-btn">Save changes</button>
          </div>

          <p id="success-message" class="success-message" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
